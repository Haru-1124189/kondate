<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="こんだて">
<title>こんだて</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>
<header class="top">
  <div id="weekNav" class="week-nav">
    <button id="prevWeek" class="icon-btn" aria-label="前の週">‹</button>
    <button id="weekLabel" class="week-label" title="今週に戻る">
      <span id="weekTitle"></span>
      <span id="weekRange" class="sub"></span>
    </button>
    <button id="nextWeek" class="icon-btn" aria-label="次の週">›</button>
  </div>
  <h1 id="pageTitle" class="page-title" hidden></h1>
  <button id="syncDot" class="sync-dot" aria-label="同期の状態"></button>
</header>

<main>
  <section id="view-plan" class="view"></section>
  <section id="view-shop" class="view" hidden></section>
  <section id="view-recipes" class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
</main>

<nav class="tabs">
  <button data-view="plan"><span class="ti">🍚</span>献立</button>
  <button data-view="shop"><span class="ti">🛒</span>買い物</button>
  <button data-view="recipes"><span class="ti">📖</span>料理</button>
  <button data-view="settings"><span class="ti">⚙️</span>設定</button>
</nav>

<dialog id="sheet"></dialog>
<div id="toast" class="toast" hidden></div>
<datalist id="ingList"></datalist>

<script src="presets.js?v=14"></script>
<script src="app.js?v=14"></script>
</body>
</html>
